<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="Top 100">
  
  <defs>
    <linearGradient id="ecBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe4ff"></stop>
      <stop offset="26%" stop-color="#5aa9ee"></stop>
      <stop offset="47%" stop-color="#1f6fc4"></stop>
      <stop offset="53%" stop-color="#0e4d95"></stop>
      <stop offset="72%" stop-color="#2b83d6"></stop>
      <stop offset="100%" stop-color="#8fcdfb"></stop>
    </linearGradient>
    <linearGradient id="ecChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="24%" stop-color="#e9eff5"></stop>
      <stop offset="46%" stop-color="#a7b4c1"></stop>
      <stop offset="53%" stop-color="#79879a"></stop>
      <stop offset="62%" stop-color="#dbe4ec"></stop>
      <stop offset="100%" stop-color="#ffffff"></stop>
    </linearGradient>
    <linearGradient id="ecSpec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"></stop>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.10"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="ecTopHalf"><rect x="0" y="0" width="1100" height="150"></rect></clipPath>
    <filter id="ecDrop" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="10" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"></feDropShadow>
    </filter>
  </defs>

  <g filter="url(#ecDrop)" font-family="&#39;Space Grotesk&#39;, &#39;Arial Black&#39;, Impact, sans-serif" font-weight="700">
    <g>
      <text x="14" y="252" font-size="152" letter-spacing="-5" fill="#062546" transform="translate(9,10)">TOP</text>
      <text x="14" y="252" font-size="152" letter-spacing="-5" fill="#0a3763" transform="translate(6,7)">TOP</text>
      <text x="14" y="252" font-size="152" letter-spacing="-5" fill="#0f4a80" transform="translate(3,4)">TOP</text>
      <text x="14" y="252" font-size="152" letter-spacing="-5" fill="url(#ecBlue)" stroke="#05203c" stroke-width="5" paint-order="stroke fill">TOP</text>
      <g clip-path="url(#ecTopHalf)"><text x="14" y="252" font-size="152" letter-spacing="-5" fill="url(#ecSpec)">TOP</text></g>
    </g>
    <g>
      <text x="310" y="256" font-size="256" letter-spacing="-14" fill="#2c333c" transform="translate(11,12)">100</text>
      <text x="310" y="256" font-size="256" letter-spacing="-14" fill="#454e59" transform="translate(7,8)">100</text>
      <text x="310" y="256" font-size="256" letter-spacing="-14" fill="#6b7684" transform="translate(3,4)">100</text>
      <text x="310" y="256" font-size="256" letter-spacing="-14" fill="url(#ecChrome)" stroke="#1c2229" stroke-width="5" paint-order="stroke fill">100</text>
      <g clip-path="url(#ecTopHalf)"><text x="310" y="256" font-size="256" letter-spacing="-14" fill="url(#ecSpec)">100</text></g>
    </g>
  </g>
</svg>